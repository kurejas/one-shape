    --table: #FFFFFF;

<canvas id="stage" tabindex="0" role="application"

<script>
(() => {
'use strict';

/* =====================================================================
   Config
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const HASH = location.hash.slice(1);
const DEMO_ASKED = Q.has('demo') || HASH === 'demo';                                   // #demo: the walkthrough, tap to play it with sound
// First visit: the walkthrough plays once by itself, with sound at once where the browser allows it. Where it doesn't (most
// browsers want a tap first) it starts silent and the first tap or key turns the sound on. A tap, a key or an arrow stops it;
// stopped or finished, the music keeps playing in the tab it reached (see startIntro). Returning visitors are remembered in browser storage and go straight in. Inside Claude
// (framed, or a claude host) nothing is remembered, so the walkthrough plays every time. ?intro forces it, ?nointro skips it.
const IN_CLAUDE = (() => { try { return window.top !== window.self || /claude/i.test(location.hostname); } catch (_) { return true; } })();
const SEEN_KEY = 'oneShape.v1.seen';
const seenBefore = () => { if (IN_CLAUDE) return false; try { return localStorage.getItem(SEEN_KEY) === '1'; } catch (_) { return false; } };
const INTRO = !DEMO_ASKED && !Q.has('t') && !Q.has('export') && !Q.has('debug') && !Q.has('nointro') && (Q.has('intro') || !seenBefore());
let DEMO = DEMO_ASKED || INTRO;
const FROZEN = Q.has('t') ? parseFloat(Q.get('t')) : null;   // ?demo&t=5.5 renders one still frame
const EXPORT = Q.has('export');                                // headless export harness, no rAF loop
const DEBUG = Q.has('debug') || HASH === 'debug';
const MUTE = Q.has('mute');

const DEFAULT_BPM = 120, MIN_BPM = 60, MAX_BPM = 180;
const MOOD = false;          // energy-driven table colour: parked for now
const TAPE_D = 1.4;          // seconds for the tape to wind down
const LOOP = 16;             // demo loop: 8 bars at 120 BPM
const MODES = ['Pulse', 'Pad', 'Sequencer', 'Bass', 'Filter', 'Tape stop'];
const FILL = [0, 1, 0, 1, 0, 1];           // 0 = black shape, 1 = white shape
const SCALES = [{ name: 'MINOR', s: [0, 3, 5, 7, 10] }, { name: 'MAJOR', s: [0, 2, 4, 7, 9] }];   // pentatonic
const ROOTS = ['A', 'B\u266D', 'B', 'C', 'C\u266F', 'D', 'E\u266D', 'E', 'F', 'F\u266F', 'G', 'A\u266D'];   // semitones above A
const PC = ['C', 'C\u266F', 'D', 'E\u266D', 'E', 'F', 'F\u266F', 'G', 'A\u266D', 'A', 'B\u266D', 'B'];
const MEL = [0, 2, 4, 7, 5, 4, 2, 4, 0, 2, 4, 7, 9, 7, 5, 4];   // sequencer melody, scale steps above the root, octave 3
const LANES = ['M', 'K', 'S', 'H'];                               // melody, kick, snare, hat
const MEL_TONES = ['PLUCK', 'BELL', 'KEYS', 'GLASS'];
const BASS_TONES = ['ACID', 'SUB', 'GROWL'];
const BG = '#E6E4E0', BLACK = '#000000', WHITE = '#FFFFFF';
const SHOW_BEAT_CIRCLE = false;           // the reactive circle behind the shape: hidden for now, kept for later

// audio event types (shared with the worklet)
const EV = { KICK: 1, SNARE: 2, HAT: 3, CLICK: 4, PLUCK: 5, TICK: 6, BELL: 7, KEYS: 8, GLASS: 9, BON: 10, BFREQ: 11, BOFF: 12, BTONE: 13, KIT: 14, AMEL: 15, CLAP: 16, RIM: 17, OHAT: 18, SHAKER: 19, FILT: 20, RIDE: 21, TAMB: 22, TSTART: 30, TRESTART: 31 };
const MEL_EV = [EV.PLUCK, EV.BELL, EV.KEYS, EV.GLASS];

/* ---------- styles: tempo, swing, drum voices, one-bar patterns (M K S H) and the sounds they start with ---------- */
const P = str => str.split('').map(Number);
const STYLES = [
  { name: 'DEEP HOUSE', bpm: 121, swing: 0.56, kick: 1, snare: EV.CLAP, hat: EV.OHAT, hatVel: () => 0.5,
    tones: { mel: 2, bass: 1, smel: 2 },
    pat: [P('0010001000100100'), P('1000100010001000'), P('0000100000001000'), P('0010001000100010')] },
  // acoustic 2-step: tambourine carries the shuffle, bar 2's backbeats become cross-stick, vibraphone stabs
  { name: '2-STEP', bpm: 132, swing: 0.64, kick: 4, snare: EV.SNARE, hat: EV.HAT, acHat: EV.TAMB, acSnare2: EV.RIM, hatVel: st_ => st_ % 2 ? 0.4 : 0.55,
    tones: { mel: 0, bass: 2, smel: 3 },
    pat: [P('1000001000010000' + '0010000010000100'), P('1000000100100000' + '1000000000101000'),

  { name: 'LO-FI', bpm: 84, swing: 0.62, kick: 3, snare: EV.RIM, hat: EV.HAT, hatVel: st_ => st_ % 4 === 0 ? 0.4 : 0.28,
    tones: { mel: 2, bass: 1, smel: 0 },
    pat: [P('1000001000100000'), P('1000000100100000'), P('0000100000001000'), P('1010101010101011')] },
  // liquid drum & bass: in the acoustic kit the H line is a ride and it starts on piano; quiet ghost snares between the backbeats
  { name: 'DRUM & BASS', bpm: 174, swing: 0.5, kick: 4, snare: EV.SNARE, hat: EV.HAT, acHat: EV.RIDE, hatVel: st_ => st_ % 2 ? 0.3 : 0.5,
    ghost: [7, 10, 15, 23, 26, 30],
    chord: [0, 2, 4], chordShift: -2,       // each melody step is a three-note chord, stacked on alternate scale notes, voiced a little lower
    tones: { mel: 1, bass: 2, smel: 2 },
    pat: [P('1000000000100000' + '0000001000000010'), P('1000000000100000' + '0010000000100000'),
          P('0000100100101001' + '0000100100101010'), P('1011101010111010' + '1010101110101110')] },
  { name: 'TECHNO', bpm: 132, swing: 0.5, kick: 2, snare: EV.CLAP, hat: EV.HAT, hatVel: st_ => st_ % 4 === 2 ? 0.62 : 0.26,
    tones: { mel: 1, bass: 0, smel: 1 },
    pat: [P('0010000000100001'), P('1000100010001000'), P('0000000000001000'), P('1111111111111111')] },
];
const patLen = sty => STYLES[sty].pat[0].length;          // 16 or 32 steps
const S_NAME = { [EV.SNARE]: 'SNARE', [EV.CLAP]: 'CLAP', [EV.RIM]: 'RIM' };
const H_NAME = { [EV.HAT]: 'HAT', [EV.OHAT]: 'OPEN HAT', [EV.SHAKER]: 'SHAKER', [EV.RIDE]: 'RIDE', [EV.TAMB]: 'TAMB' };
const hatOf = (sy, t) => kitAt(t) && sy.acHat ? sy.acHat : sy.hat;          // the acoustic kit can swap the hat for another cymbal
const isGhost = (sy, step) => !!(sy.ghost && sy.ghost.includes(step));

/* ---------- ACOUSTIC kit: physically modelled drums, upright bass and three melody instruments ---------- */
const AC_MEL = ['GUITAR', 'MARIMBA', 'PIANO', 'VIBES'];
// Recordings of real instruments, 44.1 kHz stereo MP3 (tools/embed-acoustic.mjs fills this in). Drums: The Open Source Drumkit
// (public domain). Piano, marimba, claps, shaker, claves, woodblock: VCSL (CC0).
// Guitar: University of Iowa Musical Instrument Samples (free for any use). Upright bass: Karoryfer Meatbass pizzicato (CC0),
// a 1958 Otto Rubner double bass, a note every minor third.
// Until they reach the audio engine, the modelled versions play instead.
const AC_DATA = /*ACOUSTIC:BEGIN*/[{"slot":"piano","root":55,"f":"samples/acoustic/piano-1.mp3"},{"slot":"piano","root":60,"f":"samples/acoustic/piano-2.mp3"},{"slot":"piano","root":67,"f":"samples/acoustic/piano-3.mp3"},{"slot":"piano","root":72,"f":"samples/acoustic/piano-4.mp3"},{"slot":"piano","root":79,"f":"samples/acoustic/piano-5.mp3"},{"slot":"piano","root":84,"f":"samples/acoustic/piano-6.mp3"},{"slot":"marimba","root":53,"f":"samples/acoustic/marimba-1.mp3"},{"slot":"marimba","root":60,"f":"samples/acoustic/marimba-2.mp3"},{"slot":"marimba","root":67,"f":"samples/acoustic/marimba-3.mp3"},{"slot":"marimba","root":71,"f":"samples/acoustic/marimba-4.mp3"},{"slot":"marimba","root":77,"f":"samples/acoustic/marimba-5.mp3"},{"slot":"marimba","root":84,"f":"samples/acoustic/marimba-6.mp3"},{"slot":"guitar","root":54.85,"f":"samples/acoustic/guitar-1.mp3"},{"slot":"guitar","root":59.86,"f":"samples/acoustic/guitar-2.mp3"},{"slot":"guitar","root":66.92,"f":"samples/acoustic/guitar-3.mp3"},{"slot":"guitar","root":71.9,"f":"samples/acoustic/guitar-4.mp3"},{"slot":"guitar","root":78.8,"f":"samples/acoustic/guitar-5.mp3"},{"slot":"guitar","root":82.8,"f":"samples/acoustic/guitar-6.mp3"},{"slot":"kick","root":null,"f":"samples/acoustic/kick-1.mp3"},{"slot":"kick","root":null,"f":"samples/acoustic/kick-2.mp3"},{"slot":"kick","root":null,"f":"samples/acoustic/kick-3.mp3"},{"slot":"snare","root":null,"f":"samples/acoustic/snare-1.mp3"},{"slot":"snare","root":null,"f":"samples/acoustic/snare-2.mp3"},{"slot":"snare","root":null,"f":"samples/acoustic/snare-3.mp3"},{"slot":"chh","root":null,"f":"samples/acoustic/chh-1.mp3"},{"slot":"chh","root":null,"f":"samples/acoustic/chh-2.mp3"},{"slot":"chh","root":null,"f":"samples/acoustic/chh-3.mp3"},{"slot":"ohh","root":null,"f":"samples/acoustic/ohh-1.mp3"},{"slot":"ohh","root":null,"f":"samples/acoustic/ohh-2.mp3"},{"slot":"side","root":null,"f":"samples/acoustic/side-1.mp3"},{"slot":"side","root":null,"f":"samples/acoustic/side-2.mp3"},{"slot":"clap","root":null,"f":"samples/acoustic/clap-1.mp3"},{"slot":"clap","root":null,"f":"samples/acoustic/clap-2.mp3"},{"slot":"shaker","root":null,"f":"samples/acoustic/shaker-1.mp3"},{"slot":"shaker","root":null,"f":"samples/acoustic/shaker-2.mp3"},{"slot":"ride","root":null,"f":"samples/acoustic/ride-1.mp3"},{"slot":"ride","root":null,"f":"samples/acoustic/ride-2.mp3"},{"slot":"vibes","root":52,"f":"samples/acoustic/vibes-1.mp3"},{"slot":"vibes","root":55,"f":"samples/acoustic/vibes-2.mp3"},{"slot":"vibes","root":59,"f":"samples/acoustic/vibes-3.mp3"},{"slot":"vibes","root":62,"f":"samples/acoustic/vibes-4.mp3"},{"slot":"vibes","root":65,"f":"samples/acoustic/vibes-5.mp3"},{"slot":"vibes","root":69,"f":"samples/acoustic/vibes-6.mp3"},{"slot":"vibes","root":72,"f":"samples/acoustic/vibes-7.mp3"},{"slot":"vibes","root":76,"f":"samples/acoustic/vibes-8.mp3"},{"slot":"tambHit","root":null,"f":"samples/acoustic/tambHit-1.mp3"},{"slot":"tambHit","root":null,"f":"samples/acoustic/tambHit-2.mp3"},{"slot":"tambShake","root":null,"f":"samples/acoustic/tambShake-1.mp3"},{"slot":"tambShake","root":null,"f":"samples/acoustic/tambShake-2.mp3"},{"slot":"clave","root":null,"f":"samples/acoustic/clave-1.mp3"},{"slot":"clave","root":null,"f":"samples/acoustic/clave-2.mp3"},{"slot":"wood","root":null,"f":"samples/acoustic/wood-1.mp3"},{"slot":"wood","root":null,"f":"samples/acoustic/wood-2.mp3"},{"slot":"wood","root":null,"f":"samples/acoustic/wood-3.mp3"},{"slot":"bass","root":23.75,"f":"samples/acoustic/bass-1.mp3"},{"slot":"bass","root":26.8,"f":"samples/acoustic/bass-2.mp3"},{"slot":"bass","root":30.01,"f":"samples/acoustic/bass-3.mp3"},{"slot":"bass","root":32.82,"f":"samples/acoustic/bass-4.mp3"},{"slot":"bass","root":35.83,"f":"samples/acoustic/bass-5.mp3"},{"slot":"bass","root":39.15,"f":"samples/acoustic/bass-6.mp3"},{"slot":"bass","root":42,"f":"samples/acoustic/bass-7.mp3"},{"slot":"bass","root":45,"f":"samples/acoustic/bass-8.mp3"},{"slot":"bass","root":48,"f":"samples/acoustic/bass-9.mp3"},{"slot":"bass","root":50.91,"f":"samples/acoustic/bass-10.mp3"},{"slot":"bass","root":54,"f":"samples/acoustic/bass-11.mp3"},{"slot":"bass","root":56.95,"f":"samples/acoustic/bass-12.mp3"},{"slot":"bass","root":60,"f":"samples/acoustic/bass-13.mp3"}]/*ACOUSTIC:END*/;
const acSet = slot => AC_DATA.map((s, i) => s.slot === slot ? { i, root: s.root } : null).filter(Boolean);
const AC_SETS = { mel: [acSet('guitar'), acSet('marimba'), acSet('piano'), acSet('vibes')], bass: acSet('bass'), kick: acSet('kick'), snare: acSet('snare'),
                  chh: acSet('chh'), ohh: acSet('ohh'), side: acSet('side'), clap: acSet('clap'), shaker: acSet('shaker'),
                  clave: acSet('clave'), wood: acSet('wood'), ride: acSet('ride'),
                  tambHit: acSet('tambHit'), tambShake: acSet('tambShake') };
// decode once per sample rate; the browser resamples to the device rate, so drums play back 1:1
// The recordings live next to the page as MP3 files (samples/acoustic/). Their bytes start downloading right after the first
// frame (acFetch) and are decoded once per sample rate when audio starts; the browser resamples to the device rate, so drums
// play back 1:1. Until they arrive the ACOUSTIC kit plays its modelled stand-ins and a hairline under ACOUSTIC shows progress.
// If they cannot load (the page opened from disk, offline) the hairline goes away and the stand-ins stay.
const AC = { got: 0, bytes: null, ready: 0, readyAt: -1, failed: 0 };
function acFetch() {
  if (AC.bytes) return AC.bytes;
  AC.bytes = Promise.all(AC_DATA.map(s => fetch(s.f).then(r => { if (!r.ok) throw new Error(s.f + ' ' + r.status); return r.arrayBuffer(); })
    .then(buf => { AC.got++; return buf; })));
  AC.bytes.catch(err => { AC.failed = 1; console.warn('recordings unavailable, using the modelled kit', err); });
  return AC.bytes;
}
const acProgress = () => AC.ready ? 1 : 0.9 * AC.got / AC_DATA.length;       // the last tenth is the decode
const acCache = new Map();
function acDecode(ctx) {
  if (acCache.has(ctx.sampleRate)) return acCache.get(ctx.sampleRate);
  const job = acFetch().then(bufs => Promise.all(bufs.map(async b => {
    const buf = await ctx.decodeAudioData(b.slice(0));                    // decodeAudioData detaches its input: keep the fetched copy
    const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
    let pk = 0; for (let i = 0; i < L.length; i++) pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i]));
    let on = 0; while (on < L.length && Math.max(Math.abs(L[on]), Math.abs(R[on])) < pk * 0.02) on++;   // skip the MP3 lead-in
    on = Math.max(0, on - Math.round(0.0015 * buf.sampleRate));
    return { L: L.slice(on), R: R.slice(on) };
  })));
  job.catch(() => { AC.failed = 1; });
  acCache.set(ctx.sampleRate, job);
  return job;
}

/* =====================================================================
   Math: closed-form springs (pure functions of elapsed time)
   ===================================================================== */
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
function mod(a, n) { return ((a % n) + n) % n; }

// step response 0 -> 1, zeta 0.84: under 1% overshoot
function S(tau, w = 26, z = 0.84) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * tau);
  return 1 - e * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
// free response from offset A with velocity V, settling to 0
function TR(tau, A, V, w = 22, z = 0.86) {
  if (tau < 0) return 0;
  const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * tau);
  return e * (A * Math.cos(wd * tau) + ((V + z * w * A) / wd) * Math.sin(wd * tau));
}
// critically damped impulse, peaks at 1 when tau = 1/w
const IMP = (tau, w) => tau < 0 ? 0 : w * tau * Math.exp(1 - w * tau);

/* =====================================================================
   State: an event log. Every frame is a pure function of (time, log).
   ===================================================================== */
let st;
function freshState() {
  st = {
    modes: [{ t: -Infinity, mode: 0, flip: -Infinity }],
    T: { started: false, tStart: 0, segs: [], tm: [{ t: 0, b: 0, bps: DEFAULT_BPM / 60 }] },
    bpm: STYLES[0].bpm,
    styles: [{ t: -Infinity, tap: -Infinity, style: 0 }],   // t = the bar the style starts on, tap = when it was picked
    styleBpm: STYLES.map(x => x.bpm),                       // each style remembers its tempo
    mutes: [],                                              // { t, lane, on }: tap a lane letter to silence that line
    keys: [{ t: -Infinity, root: 0, scale: 0 }],
    tones: [],                                              // { t, style, which, v }: sound changes, per style
    kits: [{ t: -Infinity, tap: -Infinity, kit: 0 }],
    seqView: [{ t: -Infinity, bar: null }],   // t = when the sound flips (on a 16th), tap = when the switch moved
    toggles: [], patBase: STYLES.map(x => x.pat.map(r => r.slice())),   // toggles carry their style, so edits are kept per style
    padNotes: [], padTouches: [], pops: [], clears: [], taps: [],
    bass: { rest: [5], w: 22, z: 0.86, sessions: [] },
    bass2: { rest: [5], w: 30, z: 0.9, sessions: [] },
    filt: { rest: [0.5, 0.5], w: 16, z: 0.8, sessions: [] },
    audio: [], pending: [], gridN: -1, gridFloor: -Infinity, uid: 1, bassNote: [-1, -1],
  };
}
freshState();

/* ---------- key, scale and sounds (logged, so they are functions of time) ---------- */
function lastBefore(L, t) { let e = L[0]; for (let i = 1; i < L.length; i++) { if (L[i].t <= t) e = L[i]; else break; } return e; }
const keyAt = t => lastBefore(st.keys, t);
const styleAt = t => lastBefore(st.styles, t).style;
const swingAt = t => STYLES[styleAt(t)].swing;
function toneAt(which, t) {
  const sty = styleAt(t);
  let v = STYLES[sty].tones[which];
  for (const e of st.tones) if (e.style === sty && e.which === which && e.t <= t) v = e.v;
  return v;
}
const kitAt = t => lastBefore(st.kits, t).kit;
function mutedAt(lane, t) {
  let on = false;
  for (const e of st.mutes) if (e.lane === lane && e.t <= t) on = e.on;
  return on;
}
const rootSemi = r => r <= 6 ? r : r - 12;                     // keep the range centred on A
const midiOf = (i, k) => 33 + rootSemi(k.root) + SCALES[k.scale].s[mod(i, 5)] + 12 * Math.floor(i / 5);   // index 0 = root, octave 1
const noteHz = (i, t) => 440 * Math.pow(2, (midiOf(i, keyAt(t)) - 69) / 12);
const noteName = (i, t) => { const m = midiOf(i, keyAt(t)); return PC[mod(m, 12)] + (Math.floor(m / 12) - 1); };
const keyName = k => ROOTS[k.root] + ' ' + SCALES[k.scale].name;

/* ---------- transport: beat as a function of time, with tape stops ---------- */
// the uninterrupted grid: a piecewise-linear tempo map
const tmAt = t => lastBefore(st.T.tm, t);
const g = t => { const s = tmAt(t); return s.b + (t - s.t) * s.bps; };
function gInv(b) { const L = st.T.tm; let s = L[0]; for (let i = 1; i < L.length; i++) { if (L[i].b <= b) s = L[i]; else break; } return s.t + (b - s.b) / s.bps; }
const bpsAt = t => tmAt(t).bps;
const bpmNow = () => st.T.started ? Math.round(st.T.tm[st.T.tm.length - 1].bps * 60) : st.bpm;
function segAt(t) {
  for (const s of st.T.segs) if (t >= s.ts && t < (s.tR == null ? Infinity : s.tR)) return s;
  return null;
}
function beatAt(t) {
  const T = st.T;
  if (!T.started || t < T.tStart) return null;
  const s = segAt(t);
  if (s) { const u = Math.min(1, (t - s.ts) / TAPE_D); return g(s.ts) + bpsAt(s.ts) * TAPE_D * (1 - Math.pow(1 - u, 3)) / 3; }
  return g(t);
}
function rateAt(t) {
  const s = segAt(t);
  if (!s) return 1;
  const u = Math.min(1, (t - s.ts) / TAPE_D);
  return (1 - u) * (1 - u);
}
// null: beat skipped or before start; undefined: not known yet (tape still held)
function timeAtBeat(b) {
  const T = st.T;
  if (!T.started) return null;
  const tc = gInv(b);
  if (tc < T.tStart) return null;
  for (const s of T.segs) {
    if (tc < s.ts) return tc;

    const moved = Math.hypot(p.lx - p.x0, p.ly - p.y0) > 14;
    if (p.role === 'ind' && !moved) A.switchTo(t, clamp(Math.round((p.lx - LY.cx) / LY.dot + 2.5), 0, 5));

cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('lostpointercapture', onUp);      // some browsers end a touch here, before or instead of pointerup
cv.addEventListener('contextmenu', e => e.preventDefault());

// keyboard, for desktop
const keysDown = new Set();
window.addEventListener('keydown', e => {
  if (introOn && !e.repeat && !e.metaKey && !e.ctrlKey && !e.altKey) { ensureAudio(); if (!introInput(e.key === 'ArrowRight' || e.key === 'ArrowLeft')) return; }
  if (e.repeat || DEMO) return;
  ensureAudio();
  const t = appNow(), m = modeAt(t);
  const tMin = AU.ready && AU.anchored ? Math.max(t, renderNowApp() + 0.004) : t;
  if (e.key === 'ArrowRight') A.next(t, 1);
  else if (e.key === 'ArrowLeft') A.next(t, -1);
  else if (/^[1-6]$/.test(e.key)) A.switchTo(t, +e.key - 1);
  else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault(); keysDown.add('space');

    else if (m === 5) A.tapeDown(tMin);

  else if (m === 1 && (e.key === 'j' || e.key === 'k')) A.padHit(t, e.key === 'j' ? 'kick' : 'snare', tMin);

  else if (e.key === '[' || e.key === ']') { const k = st.keys[st.keys.length - 1]; A.setKey(t, mod(k.root + (e.key === ']' ? 1 : -1), 12), k.scale); }
  else if (e.key === 'm') { const k = st.keys[st.keys.length - 1]; A.setKey(t, k.root, 1 - k.scale); }

  else if (e.key === 'y') A.setStyle(t, (st.styles[st.styles.length - 1].style + 1) % STYLES.length);

document.addEventListener('visibilitychange', () => {

/* =====================================================================
   Demo: a fixed script replayed through the same actions, on the grid.
   The last frame of each loop equals the first.
   ===================================================================== */
let demoStart = 0, demoLoops = 0;
function catmull(keys, t) {
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const p0 = keys[Math.max(0, i - 1)], p1 = keys[i], p2 = keys[i + 1], p3 = keys[Math.min(keys.length - 1, i + 2)];
  const u = clamp((t - p1[0]) / (p2[0] - p1[0]), 0, 1);
  const out = [];
  for (let k = 1; k < p1.length; k++) {
    const m1 = (p2[k] - p0[k]) / 2, m2 = (p3[k] - p1[k]) / 2, u2 = u * u, u3 = u2 * u;
    out.push((2 * u3 - 3 * u2 + 1) * p1[k] + (u3 - 2 * u2 + u) * m1 + (-2 * u3 + 3 * u2) * p2[k] + (u3 - u2) * m2);
  }
  return out;
}
// The walkthrough as timed steps, in order: [seconds into the loop, action]. The demo loop runs them all for a whole loop
// at once; the first-visit intro runs each one as its moment comes, so stopping it leaves an ordinary live state behind.
const SCRIPT = (() => {
  const S = [], at = (dt, fn) => S.push([dt, fn]);
  let k;
  at(0.9, B => A.pulseTap(B + 0.9));
  at(2.4, B => A.padHit(B + 2.4, 'kick'));
  at(2.9, B => A.padHit(B + 2.9, 'snare'));
  at(3.15, B => A.padHit(B + 3.15, 'kick'));
  at(3.4, B => { k = A.padHit(B + 3.4, 'kick'); }); at(3.43, B => A.padHat(B + 3.43, k));
  at(3.65, B => A.padHit(B + 3.65, 'snare'));
  at(3.9, B => A.next(B + 3.9, 1));
  at(4.35, B => A.toggle(B + 4.35, 0, 2)); at(4.7, B => A.toggle(B + 4.7, 3, 13)); at(5.05, B => A.cycleTone(B + 5.05, 'mel')); at(5.45, B => A.toggle(B + 5.45, 0, 9));
  at(5.9, B => A.next(B + 5.9, 1));
  const bk = [[6.3, 2], [6.8, 5], [7.1, 8], [7.45, 11.8], [7.75, 9], [8.15, 5], [8.45, 4.2], [8.6, 3.2]];
  at(bk[0][0], B => A.bassDown(B + bk[0][0], bk[0][1]));
  for (let s = bk[0][0] + 1 / 240; s <= bk[bk.length - 1][0] + 1e-9; s += 1 / 240) { const s_ = s; at(s_, B => A.bassMove(B + s_, catmull(bk, s_)[0])); }
  at(8.6, B => A.bassUp(B + 8.6));
  at(8.9, B => A.next(B + 8.9, 1));
  const fk = [[9.35, 0.5, 0.5], [9.8, 0.2, 0.78], [10.35, 0.1, 0.14], [10.85, 0.46, 0.08], [11.3, 0.86, 0.26], [11.42, 0.9, 0.36]];
  at(fk[0][0], B => A.filterDown(B + fk[0][0], 0.5, 0.5));
  for (let s = fk[0][0] + 1 / 240; s <= fk[fk.length - 1][0] + 1e-9; s += 1 / 240) { const s_ = s; at(s_, B => A.filterMove(B + s_, ...catmull(fk, s_))); }
  at(11.42, B => A.filterUp(B + 11.42));
  at(11.62, B => A.filterReset(B + 11.62));
  at(11.9, B => A.next(B + 11.9, 1));
  at(12.45, B => A.tapeDown(B + 12.45));
  at(13.6, B => A.tapeUp(B + 13.6));
  at(14.15, B => A.next(B + 14.15, 1));
  at(14.7, B => { A.setKey(B + 14.7, 0, 1); A.pop(B + 14.7); });           // tap the key half: A major, then back to A minor
  at(15.3, B => { A.setKey(B + 15.3, 0, 0); A.pop(B + 15.3); });

})();
function scriptLoop(B) {
  // every loop starts from the same pattern, key and sounds
  const sy = styleAt(B), def = STYLES[sy];
  for (let lane = 0; lane < 4; lane++) for (let s = 0; s < patLen(sy); s++) if (pattern(lane, s, B) !== def.pat[lane][s]) st.toggles.push({ t: B, style: sy, lane, step: s, on: !!def.pat[lane][s] });
  for (const which of ['mel', 'bass', 'smel']) if (toneAt(which, B) !== def.tones[which]) { st.tones.push({ t: B, style: sy, which, v: def.tones[which] }); if (which === 'bass') qa(EV.BTONE, B, def.tones.bass); }
  const k0 = keyAt(B); if (k0.root || k0.scale) st.keys.push({ t: B, root: 0, scale: 0 });

function setupDemo(start) {
  freshState();
  demoStart = start; demoLoops = 0;
  st.bpm = 120;                              // the demo loop is 8 bars at 120
  startTransport(start, -Infinity);
  if (Q.get('kit') === 'acoustic') st.kits = [{ t: -Infinity, tap: -Infinity, kit: 1 }];   // demo played with the acoustic kit
  moodCache.clear();
  scriptLoop(start - LOOP);                  // history only: gives frame 0 the same past as every later loop
  st.pending = [];
  ensureLoops(start);
}
function ensureLoops(t) {
  const need = Math.floor((t - demoStart) / LOOP) + 2;
  while (demoLoops < need) scriptLoop(demoStart + LOOP * demoLoops++);
}
function startDemoLive() {
  demoLive = true;
  setupDemo(appNow() + 0.25);
}
// The first-visit intro: the walkthrough played once, live, into the ordinary state. Stopping it (a tap, a key, an arrow)
// or letting it finish leaves the music playing in the tab it reached; nothing is reset.
let introOn = INTRO, introSound = false, introHint = INTRO, introIdx = 0;
function startIntro() {
  freshState();
  demoLive = true; demoStart = appNow() + 0.3; introIdx = 0;
  st.bpm = 120;
  startTransport(demoStart, -Infinity);
  AU.needsClear = true;            // when the audio clock anchors: drop notes already in the past, pick the grid up from now
  ensureAudio(true);               // try for sound right away
}
function stepIntro(t) {            // run each step as its moment comes, a little ahead so its sound is scheduled in time
  while (introIdx < SCRIPT.length && demoStart + SCRIPT[introIdx][0] <= t + 0.1) SCRIPT[introIdx++][1](demoStart);
  if (t >= demoStart + LOOP) stopIntro(t);          // one pass: it ends back on the first tab, still playing
}
function stopIntro(t) {
  if (!introOn) return;
  introOn = false; DEMO = false; demoLive = false;
  if (!IN_CLAUDE) { try { localStorage.setItem(SEEN_KEY, '1'); } catch (_) {} }
  // let go of anything the walkthrough was holding, and drop a tab change it had lined up a moment ahead
  A.bassUp(t); A.filterUp(t); A.tapeUp(t);
  while (st.modes.length > 1 && st.modes[st.modes.length - 1].t > t) st.modes.pop();
  st.audio = [];

}
// a tap or key during the intro: if the browser has kept the sound off, the first one brings it in and the walkthrough
// carries on; otherwise it stops the walkthrough. passThrough (arrow keys, clicks on a control): stop it and return true,
// so the input also does its normal job.
function introInput(passThrough) {
  if (passThrough) { introSound = true; stopIntro(appNow()); return true; }
  if (!introSound) { introSound = true; return false; }
  stopIntro(appNow());
  return false;
}

/* ---------- export harness (headless) ---------- */
async function renderAudio(from, to, script = true) {
  const sr = 48000;
  if (script) ensureLoops(to);
  const oc = new OfflineAudioContext(2, Math.ceil(to * sr), sr);
  await oc.audioWorklet.addModule(WURL);
  const node = new AudioWorkletNode(oc, 'synth', { numberOfInputs: 0, outputChannelCount: [2] });
  node.connect(oc.destination);
  node.port.postMessage({ acSamples: await acDecode(oc), acSets: AC_SETS });
  const evs = [[EV.BTONE, 0, toneAt('bass', 0), 0, 0], [EV.KIT, 0, kitAt(0), 0, 0]];
  for (let n = 0; n < 4096; n++) {
    const tn = tickTime(n, 4);
    if (tn === undefined || (tn != null && tn > to)) break;
    if (tn != null) gridStep(n, tn, (type, t, a, b, id) => evs.push([type, t, a, b, id]));
  }
  for (const e of st.audio) if (!e.x && e.t >= 0 && e.t <= to) evs.push([e.type, e.t, e.a, e.b, e.id]);
  let prev = null;
  for (let i = 0; i <= to * 200; i++) {
    const t = i / 200, x = dragVal(st.filt, t, 0), y = dragVal(st.filt, t, 1);
    if (!prev || Math.abs(x - prev[0]) + Math.abs(y - prev[1]) > 1e-5) { evs.push([EV.FILT, t, x, y, 0]); prev = [x, y]; }
  }
  const a = new Float64Array(evs.length * 5);
  evs.forEach((e, i) => a.set([e[0], Math.round(e[1] * sr), e[2], e[3], e[4]], i * 5));
  await new Promise(res => { node.port.onmessage = m => { if (m.data.pong === 1) res(); }; node.port.postMessage({ ev: a }); node.port.postMessage({ ping: 1 }); });
  const buf = await oc.startRendering();
  const s0 = Math.round(from * sr), s1 = Math.round(to * sr), n = s1 - s0;
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const w4 = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w4(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w4(8, 'WAVE'); w4(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, sr, true);
  out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); w4(36, 'data'); out.setUint32(40, n * 4, true);

  return btoa(bin);
}

/* =====================================================================
   Frame loop
   ===================================================================== */
let lastApp = 0, fpsT = 0, fpsN = 0, fps = 0;
const dbg = document.getElementById('dbg');
if (DEBUG) { dbg.hidden = false; window.__one = { st: () => st, appNow }; }
function prune(t) {
  if (DEMO) return;
  const L = st.modes;
  while (L.length > 2 && L[1].t < t - 4) { L.shift(); L[0].t = -Infinity; L[0].flip = -Infinity; }
  const old = st.toggles.filter(e => e.t < t - 6);
  if (old.length) {
    old.sort((a, b) => a.t - b.t).forEach(e => { st.patBase[e.style][e.lane][e.step] = e.on ? 1 : 0; });
    st.toggles = st.toggles.filter(e => e.t >= t - 6);
  }
  for (const L2 of [st.keys, st.T.tm, st.kits, st.styles, st.seqView]) while (L2.length > 2 && L2[1].t < t - 10) L2.shift();
  // keep only each lane's latest mute state once it's old
  if (st.mutes.length > 32) st.mutes = [0, 1, 2, 3].map(l => st.mutes.filter(e => e.lane === l).pop()).filter(Boolean);
  st.clears = st.clears.filter(c => c > t - 2);
  st.padNotes = st.padNotes.filter(p => p.t > t - 6);
  st.padTouches = st.padTouches.filter(p => p.t > t - 2);
  st.pops = st.pops.filter(p => p > t - 2);
  for (const tr of [st.bass, st.bass2, st.filt]) if (tr.sessions.length > 3) tr.sessions.splice(0, tr.sessions.length - 3);
  if (st.T.segs.length > 3) st.T.segs.splice(0, st.T.segs.length - 3);
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!DEBUG && !MUTE && !DEMO_STILL) {
    const c = AU.ctx, late = AU.touched && performance.now() - AU.touched > 1500;
    const bad = AU.err || (late && (!c || c.state !== 'running' || !AU.ready));
    if (bad) {
      dbg.hidden = false;
      dbg.textContent = `SOUND IS OFF: ${AU.err || (c ? c.state : 'no audio context')}${AU.engine ? ' · ' + AU.engine : ''}\nTap the screen again. If it stays off, check the volume and the ring/silent switch.`;
    } else if (!dbg.hidden) dbg.hidden = true;
  }
  anchorCheck();
  let t = appNow();
  if (t < lastApp) t = lastApp;
  lastApp = t;
  let rt = t;
  if (AU.anchored) { introSound = true; introHint = false; }       // sound is running (by itself, or after the first tap)
  if (introOn) stepIntro(t);
  else if (DEMO) { if (demoLive) ensureLoops(t); else rt = demoStart; }
  pump();
  sendFilter(rt);
  prune(t);
  render(rt);
  if (DEBUG) {
    fpsN++;
    if (now - fpsT > 500) { fps = fpsN * 1000 / (now - fpsT); fpsT = now; fpsN = 0; }
    const c = AU.ctx;
    dbg.textContent = `${fps.toFixed(0)} fps\n` + (c ? `audio ${c.state} ${c.sampleRate} Hz ${AU.engine || ''}\nbase ${((c.baseLatency || 0) * 1000).toFixed(1)} ms  out ${((c.outputLatency || 0) * 1000).toFixed(1)} ms\n` : 'audio off\n') +
      (AU.peak != null ? `peak ${AU.peak.toFixed(2)}\n` : '') + (AU.lat != null ? `touch→sound ${AU.lat.toFixed(1)} ms\n` : '') + (MOOD ? `mood ${lastMood.toFixed(2)}\n` : '') + `blur ${CAN_BLUR ? 'on' : 'off'}  haptics ${HAS_VIB ? 'vibrate' : IS_IOS ? 'ios switch' : 'none'}`;

window.addEventListener('resize', layout);
layout();
if (INTRO) startIntro();
else if (DEMO) setupDemo(0);

const fontsLoaded = (document.fonts ? Promise.race([
  Promise.all([document.fonts.load('500 11px Geist'), document.fonts.load('400 9px Geist')]),
  new Promise(r => setTimeout(r, EXPORT ? 20000 : 2500)),
]) : Promise.resolve()).then(() => { fontsReady = true; LBL.clear(); });

if (EXPORT || FROZEN != null) {
  fontsLoaded.then(() => render(FROZEN ?? 0));
  window.__demo = {
    ready: fontsLoaded.then(() => document.fonts ? [...document.fonts].some(f => f.family.replace(/"/g, '') === 'Geist' && f.status === 'loaded') : false),
    renderAt(t) { ensureLoops(t); render(t); },
    pixels(t) { ensureLoops(t); render(t); return C.getImageData(0, 0, cv.width, cv.height).data; },
    diff(a, b) { const A1 = this.pixels(a).slice(), B1 = this.pixels(b); let n = 0; for (let i = 0; i < A1.length; i++) if (A1[i] !== B1[i]) n++; return n; },
    renderAudio,
    kitAt: t => kitAt(t),
    circle(style, t, mute = []) {                 // beat-circle energy for one style's groove, with lines muted
      freshState();
      st.styles = [{ t: -Infinity, tap: -Infinity, style }];
      st.mutes = mute.map(lane => ({ t: -Infinity, lane, on: true }));
      st.bpm = STYLES[style].bpm; startTransport(0, -Infinity);
      const out = []; for (let i = 0; i < 240; i++) out.push(circleEnergy(i / 120));

      return out;

    // one style's own groove at its own tempo, for listening checks (no demo script)
    async renderStyle(style, secs, kit = 0, mute = []) {
      freshState();
      st.mutes = mute.map(lane => ({ t: -Infinity, lane, on: true }));
      st.styles = [{ t: -Infinity, tap: -Infinity, style }];
      st.kits = [{ t: -Infinity, tap: -Infinity, kit }];
      st.modes = [{ t: -Infinity, mode: 2, flip: -Infinity }];
      st.bpm = STYLES[style].bpm;
      startTransport(0, -Infinity);
      const out = await renderAudio(0, secs, false);
      setupDemo(0);
      return out;
    },
    // a scripted Bass-mode gesture for listening checks: [[t, 'down' | 'move' | 'up', raw 0..10], ...], all lines muted
    async renderBass(style, secs, kit, gesture) {
      freshState();
      st.mutes = [0, 1, 2, 3].map(lane => ({ t: -Infinity, lane, on: true }));
      st.styles = [{ t: -Infinity, tap: -Infinity, style }];
      st.kits = [{ t: -Infinity, tap: -Infinity, kit }];
      st.modes = [{ t: -Infinity, mode: 3, flip: -Infinity }];
      st.bpm = STYLES[style].bpm;
      startTransport(0, -Infinity);
      for (const [t, what, raw] of gesture) what === 'down' ? A.bassDown(t, raw) : what === 'move' ? A.bassMove(t, raw) : A.bassUp(t);

      setupDemo(0);
      return out;
    },
    styleShot(style, mode, t, kit = 0) {
      freshState();
      st.styles = [{ t: -Infinity, tap: -Infinity, style }];
      st.kits = [{ t: -Infinity, tap: -Infinity, kit }];
      st.modes = [{ t: -Infinity, mode, flip: -Infinity }];
      st.bpm = STYLES[style].bpm;

})();
